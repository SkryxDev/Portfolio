<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SkryxDev — student developer from Vicenza, Italy. Websites, Minecraft plugins, Discord bots, and Linux server setups."
    />
    <meta property="og:title" content="SkryxDev" />
    <meta
      property="og:description"
      content="Websites, Minecraft plugins, Discord bots, and Linux server setups."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('skryxdev-theme')
          document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <title>SkryxDev</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
